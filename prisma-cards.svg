<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="252" viewBox="0 0 1280 252"><rect x="0" y="0" width="416" height="252" rx="12" fill="#111D30"/><path d="M28 32h40" stroke="#72A893" stroke-width="3"/><text x="354" y="48" fill="#8297B6" font-family="Arial" font-size="20">01</text><text x="28" y="110" fill="#F4F7FC" font-family="Arial" font-size="25" font-weight="700">Origem preservada</text><text x="28" y="157" fill="#BFCFE4" font-family="Arial" font-size="18">IDs próprios e chave composta.</text><text x="28" y="191" fill="#BFCFE4" font-family="Arial" font-size="18">Sem misturar empresas ou fontes.</text><rect x="432" y="0" width="416" height="252" rx="12" fill="#111D30"/><path d="M460 32h40" stroke="#88B3FF" stroke-width="3"/><text x="786" y="48" fill="#8297B6" font-family="Arial" font-size="20">02</text><text x="460" y="110" fill="#F4F7FC" font-family="Arial" font-size="25" font-weight="700">Conciliação explicável</text><text x="460" y="157" fill="#BFCFE4" font-family="Arial" font-size="18">Referência, candidato ou conflito.</text><text x="460" y="191" fill="#BFCFE4" font-family="Arial" font-size="18">Contato não é prova de identidade.</text><rect x="864" y="0" width="416" height="252" rx="12" fill="#111D30"/><path d="M892 32h40" stroke="#D98FA2" stroke-width="3"/><text x="1218" y="48" fill="#8297B6" font-family="Arial" font-size="20">03</text><text x="892" y="110" fill="#F4F7FC" font-family="Arial" font-size="25" font-weight="700">Evidências verificáveis</text><text x="892" y="157" fill="#BFCFE4" font-family="Arial" font-size="18">Snapshots JSONL e SHA-256.</text><text x="892" y="191" fill="#BFCFE4" font-family="Arial" font-size="18">Ausência de fonte não vira zero.</text></svg>